<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PharmaTrack pharmacy management dashboard for inventory, sales, and stock overview."
    />
    <script>
      ;(function () {
        try {
          var stored = window.localStorage.getItem('pharmatrack.preferences')
          var preferences = stored ? JSON.parse(stored) : {}
          var theme = preferences.theme === 'dark' ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.lang =
            preferences.language === 'am' ? 'am' : 'en'
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          // Ignore malformed or unavailable storage.
        }
      })()
    </script>
    <title>PharmaTrack — Pharmacy Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
